# pnpm-workspace.yaml — forge supply-chain policy (engineering → security §5).
# The workspace packages (packages/*, app) are added in PLAN T-04; until then the app is the root package.
packages: []

minimumReleaseAge: 1440        # don't install versions younger than 1 day
minimumReleaseAgeExclude: []   # urgent fixes only, each with a DECISIONS line: - pkg@1.2.3
trustPolicy: no-downgrade      # refuse a version whose publishing trust level dropped
trustPolicyExclude: []         # only with a recorded decision
blockExoticSubdeps: true       # no git/tarball sources for transitive dependencies

# The ONLY packages allowed to run install scripts. Unlisted = blocked.
allowBuilds:
  esbuild: true
  sharp: true
